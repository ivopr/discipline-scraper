name: scrape
on:
  schedule:
    - cron: "0 11 * * *" # 08:00 BRT
    - cron: "0 21 * * *" # 18:00 BRT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run scrape
      - name: Commit if changed
        run: |
          git diff --quiet data/disciplines.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update disciplines"
          git push
